# Nginx reverse proxy config for the EC2 host — sits in front of the
# Dockerized API (docker-compose.prod.yml's `server` service, bound to
# 127.0.0.1:5000 only, never exposed directly). Runs on the HOST, not in a
# container: Certbot's `--nginx` plugin (scripts/setup-ssl.sh) needs to
# manage a real host-level Nginx and its config/cert renewal, which is
# simpler than a Dockerized Nginx + a Dockerized Certbot coordinating
# volumes and renewal crons for a single-instance deployment.
#
# DEPLOYMENT ORDER MATTERS:
#   1. Copy this file to /etc/nginx/sites-available/app.conf as-is (HTTP
#      only) and enable it — see scripts/setup-ec2.sh.
#   2. Run scripts/setup-ssl.sh (Certbot). Certbot's --nginx plugin detects
#      this server block, obtains a certificate, and REWRITES this file in
#      place to add the `listen 443 ssl` block + an HTTP→HTTPS redirect.
#      That's expected and normal — don't hand-edit in SSL directives
#      yourself first, or Certbot has nothing sensible to modify.
#
# The frontend is NOT served here — it's on S3 + CloudFront (see
# scripts/deploy-frontend.sh). This file only ever proxies to the API.

server {
    listen 80;
    listen [::]:80;
    server_name _; # replaced with your real domain by scripts/setup-ssl.sh's certbot run

    client_max_body_size 2m;

    # /metrics is deliberately NOT proxied here — see server/src/config/metrics.ts
    # for why network isolation (not app-level auth) is what protects it.
    # It's reachable only from the EC2 host itself (e.g. a CloudWatch agent
    # scraping http://127.0.0.1:5000/metrics directly), never through this
    # public-facing proxy.

    location /api/v1/ {
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /health {
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
