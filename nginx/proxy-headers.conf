# Shared reverse-proxy headers — included by every location block in
# app.conf (deployed to /etc/nginx/snippets/proxy-headers.conf by
# scripts/setup-ec2.sh). Kept in one file so both the /api/v1/ and /health
# location blocks (and any added later) stay in sync automatically instead
# of copy-pasted per-block.

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Express's `app.set('trust proxy', 1)` (server/src/app.ts) relies on this
# to know a request arrived over HTTPS even though Nginx talks to it over
# plain HTTP on 127.0.0.1 — without it, secure cookies and rate-limiting's
# IP detection would misbehave.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;

# NOTE: no WebSocket/SSE upgrade headers here — this app has no such
# endpoint today (job status is polled over plain HTTP, see
# docs/ARCHITECTURE.md). Doing that correctly requires a `map
# $http_upgrade $connection_upgrade` directive at the nginx http{} level
# (not something a location-level snippet can declare) — a hardcoded
# `Connection: upgrade` header would break keep-alive on every normal
# request instead. Add it properly, with the map, if/when a WebSocket
# endpoint actually exists.

proxy_connect_timeout 10s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
